http:
  public_base: https://mas.${config.networking.fqdn}
  listeners:
    - name: web
      resources:
        - name: discovery
        - name: human
        - name: oauth
        - name: compat
        - name: graphql
          playground: true
        - name: assets
        - name: adminapi
      binds: [address: "[::1]:8081"]
    - name: internal
      resources:
        - name: health
        - name: prometheus
      binds: [address: "[::1]:8082"]

database:
  uri: postgres:///mas?host=/run/postgresql

matrix:
  homeserver: ${config.networking.fqdn}
  secret_file: /run/secrets/mas/secret-mas
  endpoint: http://[::1]:8008

secrets:
  encryption_file: /run/secrets/mas/enc-key
  keys:
    - kid: rsa
      key_file: /run/secrets/mas/rsa.pem
    - kid: ec-1
      key_file: /run/secrets/mas/ec-1.pem
    - kid: ec-2
      key_file: /run/secrets/mas/ec-2.pem
    - kid: ec-3
      key_file: /run/secrets/mas/ec-3.pem

passwords:
  enabled: false

upstream_oauth2:
  providers:
    - id: 01KTHCY8SQPGTM0G37HAZXPPSH
      issuer: https://auth.fixthislater.com/realms/main
      client_id: synapse
      client_secret_file: /run/secrets/synapse-client-secret
      token_endpoint_auth_method: client_secret_post
      claims_imports:
        skip_confirmation: true
        localpart:
          action: require
        displayname:
          action: force
        email:
          action: force
        account_name:
          action: force